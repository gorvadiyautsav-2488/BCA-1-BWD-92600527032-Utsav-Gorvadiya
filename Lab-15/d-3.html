
<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid Table</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Student Details</h2>

    <!-- Table Header -->
    <div class="row bg-dark text-white p-2">
        <div class="col-4"><b>Name</b></div>
        <div class="col-4"><b>Course</b></div>
        <div class="col-4"><b>City</b></div>
    </div>

    <!-- Row 1 -->
    <div class="row border p-2 bg-danger text-white">
        <div class="col-4">Utsav</div>
        <div class="col-4">BCA</div>
        <div class="col-4">Rajkot</div>
    </div>

    <!-- Row 2 -->
    <div class="row border p-2 bg-success text-white">
        <div class="col-4">Rahul</div>
        <div class="col-4">BCA</div>
        <div class="col-4">Ahmedabad</div>
    </div>

    <!-- Row 3 -->
    <div class="row border p-2 bg-primary text-white">
        <div class="col-4">Amit</div>
        <div class="col-4">BCA</div>
        <div class="col-4">Surat</div>
    </div>

</div>

</body>
</html>
