<!DOCTYPE html>
<html>
<head>
    <title>Image Opacity Effect</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }

        img {
            width: 400px;
            height: 300px;
            object-fit: cover;
            opacity: 1;
            transition: opacity 0.5s;
        }

        /* Mouse Over */
        img:hover {
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <h1>Image Opacity Effect</h1>

    <img src="c:\Users\Utsav\Pictures\animals-kali-linux-wallpaper-preview.jpg" alt="Sample Image">

   
</body>
</html>
